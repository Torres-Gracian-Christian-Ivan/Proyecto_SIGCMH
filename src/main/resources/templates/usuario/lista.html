<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Usuarios - SIGCMH</title>

    <link rel="stylesheet"
          th:href="@{/bootstrap/css/bootstrap.min.css}">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2>Usuarios</h2>

            <p class="text-muted mb-0">
                Administración de usuarios del sistema
            </p>

        </div>


        <a th:href="@{/usuarios/nuevo}"
           class="btn btn-primary">

            Nuevo usuario

        </a>

    </div>


    <!-- MENSAJE -->

    <div th:if="${mensaje}"
         class="alert alert-success"
         th:text="${mensaje}">
    </div>


    <!-- TABLA -->

    <div class="card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table
                              table-striped
                              table-hover
                              align-middle">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Nombre</th>

                        <th>Correo</th>

                        <th>Perfil</th>

                        <th>Estado</th>

                        <th class="text-center">
                            Acciones
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr th:each="usuario : ${usuarios}">

                        <td th:text="${usuario.id}">
                        </td>


                        <td th:text="${usuario.nombreCompleto}">
                        </td>


                        <td th:text="${usuario.email}">
                        </td>


                        <td th:text="${usuario.perfil}">
                        </td>


                        <td>

                            <span th:if="${usuario.activo}"
                                  class="badge bg-success">

                                Activo

                            </span>


                            <span th:unless="${usuario.activo}"
                                  class="badge bg-secondary">

                                Inactivo

                            </span>

                        </td>


                        <td class="text-center">


                            <a th:href="@{/usuarios/ver/{id}
                                (id=${usuario.id})}"
                               class="btn
                                      btn-sm
                                      btn-outline-primary">

                                Ver

                            </a>


                            <a th:href="@{/usuarios/editar/{id}
                                (id=${usuario.id})}"
                               class="btn
                                      btn-sm
                                      btn-outline-warning">

                                Editar

                            </a>


                            <form th:if="${usuario.activo}"
                                  th:action="@{/usuarios/eliminar/{id}
                                  (id=${usuario.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn
                                               btn-sm
                                               btn-outline-danger"
                                        onclick="return confirm(
                                        '¿Deseas desactivar este usuario?'
                                        );">

                                    Desactivar

                                </button>

                            </form>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(usuarios)}">

                        <td colspan="6"
                            class="text-center text-muted">

                            No existen usuarios registrados.

                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <div class="mt-3">

        <a th:href="@{/}"
           class="btn btn-secondary">

            Regresar

        </a>

    </div>

</div>

</body>

</html>
