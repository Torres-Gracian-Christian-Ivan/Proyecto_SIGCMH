<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{plantillas/plantilla::head}"></head>

<body>

<div class="wrapper">

    <aside th:replace="~{plantillas/plantilla::sidebar}"></aside>

    <div class="content">

        <header th:replace="~{plantillas/plantilla::header}"></header>

        <main class="main-content">

            <div class="card shadow">

                <div class="card-header">

                    <h3>

                        <i class="bi bi-calendar-check"></i>

                        Información de la cita médica

                    </h3>

                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">ID</label>
                            <p th:text="${cita.id}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Paciente</label>
                            <p th:text="${cita.nombrePaciente}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Médico</label>
                            <p th:text="${cita.nombreMedico}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Fecha y hora</label>

                            <p th:text="${#temporals.format(cita.fechaHora,'dd/MM/yyyy HH:mm')}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Estado</label>

                            <span class="badge"
                                  th:text="${cita.estado}"
                                  th:classappend="
                                    ${cita.estado == 'Programada'} ? ' bg-primary' :
                                    (${cita.estado == 'Atendida'} ? ' bg-success' :
                                    (${cita.estado == 'Cancelada'} ? ' bg-danger' :
                                    ' bg-secondary'))">
                            </span>

                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">
                                Usuario
                            </label>

                            <p th:text="${cita.nombreUsuario}"></p>

                        </div>

                        <div class="col-12 mb-3">

                            <label class="fw-bold">
                                Motivo
                            </label>

                            <p th:text="${cita.motivoConsulta}"></p>

                        </div>

                        <div class="col-12 mb-3">

                            <label class="fw-bold">
                                Observaciones
                            </label>

                            <p th:text="${cita.observaciones}"></p>

                        </div>

                    </div>

                    <hr>

                    <a th:href="@{/citas}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Regresar

                    </a>

                </div>

            </div>

        </main>

        <footer th:replace="~{plantillas/plantilla::footer}"></footer>

    </div>

</div>

<div th:replace="~{plantillas/plantilla::scripts}"></div>

</body>

</html>
