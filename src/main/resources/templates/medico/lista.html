<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head th:replace="~{plantillas/plantilla::head}"></head>

<body>

<div class="wrapper">

    <aside th:replace="~{plantillas/plantilla::sidebar}"></aside>

    <div class="content">

        <header th:replace="~{plantillas/plantilla::header}"></header>

        <main class="main-content">

            <div class="card shadow">

                <div class="card-body">

                    <h2>
                        <i class="bi bi-person-badge-fill"></i>
                        Médicos registrados
                    </h2>

                    <p class="text-muted">
                        A continuación se muestra el listado de médicos registrados.
                    </p>

                    <hr>

                    <div th:if="${success}"
                         class="alert alert-success"
                         th:text="${success}">
                    </div>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>


                    <!-- Solo admin -->
                    <div class="mb-3 text-end"
                         sec:authorize="hasRole('ADMINISTRADOR')">

                        <a th:href="@{/medicos/nuevo}"
                           class="btn btn-success">

                            Nuevo médico

                        </a>

                    </div>


                    <table class="table table-hover table-bordered align-middle">

                        <thead class="table-primary">

                        <tr>

                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Identificación</th>
                            <th>Especialidad</th>
                            <th>Consultorio</th>
                            <th>Acciones</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="medico : ${medicos}">

                            <td th:text="${medico.id}"></td>

                            <td th:text="${medico.nombreCompleto}"></td>

                            <td th:text="${medico.numeroIdentificacion}"></td>

                            <td th:text="${medico.especialidad}"></td>

                            <td th:text="${medico.consultorio}"></td>

                            <td>

                                <!-- ADMINISTRADOR Y RECEPCIONISTA -->
                                <a class="btn btn-info btn-sm"
                                   th:href="@{/medicos/ver/{id}(id=${medico.id})}">
                                    Ver
                                </a>

                                <a class="btn btn-secondary btn-sm"
                                   th:href="@{/medicos/{id}/horarios(id=${medico.id})}">

                                    Horarios

                                </a>


                                <!-- SOLO ADMINISTRADOR -->
                                <a sec:authorize="hasRole('ADMINISTRADOR')"
                                   class="btn btn-warning btn-sm"
                                   th:href="@{/medicos/editar/{id}(id=${medico.id})}">
                                    Editar
                                </a>


                                <!-- solo admin elimina  -->
                                <a sec:authorize="hasRole('ADMINISTRADOR')"
                                   class="btn btn-danger btn-sm"
                                   th:href="@{/medicos/eliminar/{id}(id=${medico.id})}"
                                   onclick="return confirm('¿Desea eliminar este médico?');">
                                    Eliminar
                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

        <footer th:replace="~{plantillas/plantilla::footer}"></footer>

    </div>

</div>

<div th:replace="~{plantillas/plantilla::scripts}"></div>

</body>
</html>
