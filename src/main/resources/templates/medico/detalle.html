<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{plantillas/plantilla::head}"></head>

<body>

<div class="wrapper">

    <aside th:replace="~{plantillas/plantilla::sidebar}"></aside>

    <div class="content">

        <header th:replace="~{plantillas/plantilla::header}"></header>

        <main class="main-content">

            <div class="card shadow">

                <div class="card-header">
                    <h3>Información del Medico</h3>
                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">ID</label>
                            <p th:text="${medico.id}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Nombre completo</label>
                            <p th:text="${medico.nombreCompleto}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Número de identificación</label>
                            <p th:text="${medico.numeroIdentificacion}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Contacto</label>
                            <p th:text="${medico.telefono}"></p>
                            <p th:text="${medico.email}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Especialidad</label>
                            <p th:text="${medico.especialidad}"></p>
                        </div>


                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Consultorio</label>
                            <p th:text="${medico.consultorio}"></p>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Activo</label>
                            <span class="badge bg-success"
                                  th:if="${medico.activo}">
                    Sí
                </span>

                            <span class="badge bg-danger"
                                  th:unless="${medico.activo}">
                    No
                </span>
                        </div>

                    </div>

                    <hr>

                    <a th:href="@{/medicos}" class="btn btn-secondary">
                        Regresar
                    </a>

                </div>

            </div>

        </main>

        <footer th:replace="~{plantillas/plantilla::footer}"></footer>

    </div>

</div>

<div th:replace="~{plantillas/plantilla::scripts}"></div>

</body>
</html>
