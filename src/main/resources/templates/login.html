<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SIGCMH</title>

    <link rel="stylesheet"
          th:href="@{/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/tema/miestilo.css}">

</head>


<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Iniciar sesión
                    </h3>


                    <!-- Error de autenticación -->
                    <div th:if="${param.error}"
                         class="alert alert-danger">

                        <span th:text="#{auth.invalid.credentials}">
                            El correo electrónico o la contraseña son incorrectos.
                        </span>

                    </div>


                    <!-- Logout exitoso -->
                    <div th:if="${param.logout}"
                         class="alert alert-success">

                        <span th:text="#{auth.logout.success}">
                            Sesión cerrada correctamente.
                        </span>

                    </div>


                    <form th:action="@{/login}"
                          method="post">


                        <!-- Correo electrónico -->
                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">

                                Correo electrónico

                            </label>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="correo@ejemplo.com"
                                   autocomplete="email"
                                   required>

                        </div>


                        <!-- Contraseña -->
                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">

                                Contraseña

                            </label>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Ingrese su contraseña"
                                   autocomplete="current-password"
                                   required>

                        </div>


                        <!-- Botón login -->
                        <button type="submit"
                                class="btn btn-primary w-100">

                            Iniciar sesión

                        </button>

                    </form>


                    <!-- Regresar -->
                    <div class="text-center mt-3">

                        <a th:href="@{/}">
                            Regresar al inicio
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
